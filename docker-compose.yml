services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # Télécharge les modèles au premier démarrage
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull llama3.2 && ollama pull nomic-embed-text"]

  api:
    build: .
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
      - CHAT_MODEL=llama3.2
      - EMBED_MODEL=nomic-embed-text
    volumes:
      - rag-data:/data
    ports:
      - "8000:8000"

volumes:
  ollama:
  rag-data:
